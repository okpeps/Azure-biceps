name: Deploy Whizlabs Connected Infrastructure

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Discover Sandbox Resource Group
        id: get_rg
        run: |
          echo "🔍 Fetching sandbox resource group name..."
          WHIZ_RG=$(az group list --query "[0].name" -o tsv)
          echo "RESOURCE_GROUP=$WHIZ_RG" >> $GITHUB_ENV
          echo "🚀 Targeted Resource Group: $WHIZ_RG"

      - name: Deploy VNet 1 (whizNet1)
        run: |
          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --parameters "./Implementing Virtual Network Peering/vnet.bicepparam"

      - name: Deploy VNet 2 (whizNet2)
        run: |
          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --parameters "./Implementing Virtual Network Peering/vnet1.bicepparam"

      - name: Establish VNet Peering
        run: |
          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --parameters "./Implementing Virtual Network Peering/peering.bicepparam"

      - name: Deploy VM 1
        run: |
          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --parameters "./Implementing Virtual Network Peering/vm.bicepparam"

      - name: Deploy VM 2
        run: |
          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --parameters "./Implementing Virtual Network Peering/vm1.bicepparam"
